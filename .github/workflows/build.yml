# 构建并部署 | Build and deploy

name: build

on:
  workflow_dispatch:
  push:
    tags:
      # REF https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  PACKAGE_PATH: ./workspace/plugins/monaco-editor

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      # REF https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 将要拉取的仓库 | repository will to pull
          repository: Zuoqiu-Yingyi/siyuan-packages-monorepo
          # 递归拉取 submodule | recursively checkout submodules
          submodules: recursive

      # Setup pnpm with Node.js
      # REF: https://github.com/marketplace/actions/setup-pnpm-with-runtime
      - name: Setup pnpm with Node.js
        uses: pnpm/setup@v2
        with:
          package-json-file: ./workspace/package.json
          cache-dependency-path: ./workspace/pnpm-lock.yaml
          cache: true
          install: false

      # Install dependencies
      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
          cd ./workspace
          pnpm install

      # Build package
      - name: Build package
        run: |
          cd $GITHUB_WORKSPACE
          cd $PACKAGE_PATH
          pnpm build

      # Deploy to publish branch
      # REF https://github.com/marketplace/actions/github-pages
      - name: Deploy to publish branch
        if: success()
        uses: crazy-max/ghaction-github-pages@v5
        with:
          # # 构建产物目录 | directory of build artifacts
          build_dir: ${{ env.PACKAGE_PATH }}/dist

          # # 提交到目标分支
          target_branch: publish
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_ACTIONS }}
